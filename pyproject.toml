[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "listmonk-api"
version = "2.3.0"
description = "Agent package for Listmonk"
readme = "README.md"
authors = [{ name = "Project Maintainers", email = "maintainers@users.noreply.github.com" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3"]
requires-python = ">=3.12"
dependencies = [
    "agent-connector-sdk[mcp]>=0.3.0,<1.0.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
mcp = [ "agent-connector-sdk[mcp]>=0.3.0,<1.0.0",]
all = [ "agent-connector-sdk[mcp]>=0.3.0,<1.0.0",]
test = [ "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
listmonk-mcp = "listmonk_api.mcp_server:mcp_server"

[tool.setuptools.packages.find]
where = ["."]

[project.entry-points."agent_connector_sdk.skill_providers"]
listmonk-api = "listmonk_api.skills"

[project.entry-points."agent_connector_sdk.ontology_providers"]
listmonk-api = "listmonk_api.ontology"

[project.entry-points."agent_connector_sdk.source_connector_providers"]
listmonk-api = "listmonk_api.connectors"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
listmonk_api = [ "mcp_config.json", "skills/**", "prompts/**", "ontology/**", "connectors/**",]

[tool.codespell]
ignore-words-list = "optin"

[tool.coverage.run]
omit = [
    "listmonk_api/listmonk_api.py",
    "listmonk_api/__main__.py",
]

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]
