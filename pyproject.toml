[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "listmonk-api"
version = "2.3.5"
description = "Agent package for Listmonk"
readme = "README.md"
authors = [{ name = "Repository Maintainers", email = "maintainers@knuckles.team" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3"]
requires-python = ">=3.12"
dependencies = [
    "agent-connector-sdk[mcp]>=0.5.4,<0.6.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
test = [ "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
listmonk-mcp = "agent_connector_sdk.cli:serve"

# The one declared connector identity: the fleet name (SDK-CONNECTOR-CONTROL-R071).
[project.entry-points."agent_connector_sdk.connector"]
listmonk-mcp = "listmonk_api:connector"

[tool.setuptools.packages.find]
where = ["."]

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
listmonk_api = [ "mcp_config.json", "skills/**", "prompts/**", "ontology/**", "connectors/**",]

[tool.codespell]
ignore-words-list = "optin"

[tool.coverage.run]
omit = [
    "listmonk_api/listmonk_api.py",
    "listmonk_api/__main__.py",
]

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.pipelines.container]
port = 8004
debug_apt = ["default-jre", "ripgrep", "tree", "fd-find", "curl", "nano", "build-essential", "cmake", "libssl-dev", "libcurl4-openssl-dev", "pkg-config", "cargo", "rustc"]

[tool.ruff]
extend-exclude = ["tests", "scripts"]
