---
services:
  listmonk-agent:
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${AGENT_CONTAINER_MEMORY_LIMIT:-4g}
    cpus: ${AGENT_CONTAINER_CPU_LIMIT:-2.0}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    # image: docker.io/${LISTMONK_API_AGENT_IMAGE:?set-LISTMONK_API_AGENT_IMAGE-to-image@sha256-digest}
    build:
      context: .. # Debug
      dockerfile: docker/debug.Dockerfile
    container_name: listmonk-agent
    hostname: listmonk-agent
    command: [ "listmonk-agent" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    env_file:
      - ../.env
    environment:
      - "HOST=0.0.0.0"
      - "PORT=9001"
      - "TRANSPORT=stdio"
      - "LISTMONK_URL=${LISTMONK_URL}"
      - "LISTMONK_USERNAME=${LISTMONK_USERNAME}"
      - "LISTMONK_TOKEN=${LISTMONK_TOKEN}"
      - "DEBUG=False"
      - "ENABLE_OTEL=True"
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9001/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
